name: YouTube → StudyTracker lesson bridge
# Full YouTube requests run only on manual dispatch or scoped [playlist-run] commits.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-playlist.yml'
      - 'scripts/youtube_playlist_catalog.py'
      - 'scripts/playlist_transcripts.py'
      - 'scripts/playlist_studytracker_bridge.py'
      - 'scripts/test_playlist_pipeline.py'
  workflow_dispatch:
    inputs:
      playlist_url:
        description: Public YouTube playlist URL
        required: true
        type: string
        default: https://youtube.com/playlist?list=PLSYiXUktJiZeqUJyNFUgFHwOUNydbC-II
      fetch_transcripts:
        description: Attempt Turkish captions for all playlist videos
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: yt-playlist-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      PLAYLIST_URL: ${{ github.event.inputs.playlist_url || 'https://youtube.com/playlist?list=PLSYiXUktJiZeqUJyNFUgFHwOUNydbC-II' }}
      FETCH_TRANSCRIPTS: ${{ github.event.inputs.fetch_transcripts || 'true' }}
      RUN_PLAYLIST: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[playlist-run]') }}
    steps:
      - name: Checkout LiseDers content
        uses: actions/checkout@v4
      - name: Checkout StudyTracker V2 sources (read-only)
        uses: actions/checkout@v4
        with:
          repository: TheOsmanYILDIRIM/study-tracker
          path: study-tracker
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test mapping, transcript parsing and importer contracts
        run: python -m unittest discover -s scripts -p 'test_playlist_pipeline.py' -v
      - name: Install yt-dlp
        if: env.RUN_PLAYLIST == 'true'
        run: python -m pip install --disable-pip-version-check 'yt-dlp>=2025.1.0'
      - name: Validate URL and extract playlist
        if: env.RUN_PLAYLIST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import urlparse, parse_qs
          parsed = urlparse(os.environ["PLAYLIST_URL"])
          if parsed.scheme != "https" or parsed.hostname not in {"youtube.com", "www.youtube.com", "m.youtube.com"}:
              raise SystemExit("Only HTTPS youtube.com playlist URLs are accepted")
          if parsed.path != "/playlist" or not parse_qs(parsed.query).get("list"):
              raise SystemExit("Expected /playlist?list=...")
          PY
          mkdir -p output
          yt-dlp --ignore-errors --skip-download --flat-playlist --dump-single-json \
            --extractor-args "youtube:lang=tr" \
            --no-warnings --socket-timeout 20 --retries 3 \
            "$PLAYLIST_URL" > output/raw-playlist.json
          python scripts/youtube_playlist_catalog.py \
            --input output/raw-playlist.json \
            --output output/playlist-catalog.json \
            --source "$PLAYLIST_URL"
      - name: Fetch Turkish captions per video (no video downloads)
        if: env.RUN_PLAYLIST == 'true' && env.FETCH_TRANSCRIPTS != 'false'
        run: |
          python scripts/playlist_transcripts.py \
            --catalog output/playlist-catalog.json \
            --output output/transcripts --max-videos 200
      - name: Propose matches to existing StudyTracker V2 lessons
        if: env.RUN_PLAYLIST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/playlist_studytracker_bridge.py \
            --catalog output/playlist-catalog.json \
            --studytracker-dir study-tracker \
            --course course_mat_9 \
            --transcripts output/transcripts \
            --output output/studytracker-mapping.json
          python study-tracker/scripts/import-liseders-playlist.py \
            --root study-tracker \
            --mapping output/studytracker-mapping.json \
            --approvals study-tracker/content/v2/playlist-imports/ilyas-gunes-mat9.approvals.json \
            --report output/studytracker-import-dry-run.json
      - name: Version source playlist and review mapping in LiseDers
        if: env.RUN_PLAYLIST == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, shutil
          from pathlib import Path
          catalog = json.loads(Path("output/playlist-catalog.json").read_text(encoding="utf-8"))
          playlist_id = str(catalog["playlist_id"])
          if not re.fullmatch(r"[A-Za-z0-9_-]{5,128}", playlist_id):
              raise SystemExit("Unsafe playlist ID")
          dest = Path("data/video_playlists") / playlist_id
          dest.mkdir(parents=True, exist_ok=True)
          for source, name in [
              ("output/playlist-catalog.json", "playlist-catalog.json"),
              ("output/studytracker-mapping.json", "topic-matches.json"),
              ("output/transcripts/manifest.json", "transcript-status.json"),
          ]:
              src = Path(source)
              if src.exists():
                  shutil.copyfile(src, dest / name)
          print(f"Review records staged in {dest}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/video_playlists/
          if ! git diff --cached --quiet; then
            git commit -m "data: sync yt-dlp playlist curriculum candidates [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish run summary
        if: always() && env.RUN_PLAYLIST == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['## LiseDers / StudyTracker playlist bridge']
          mapping = Path('output/studytracker-mapping.json')
          if mapping.exists():
              m = json.loads(mapping.read_text())
              lines.append(f"- Videos: {m['summary']['videos']}")
              lines.append(f"- Suggested matches: {m['summary'].get('candidate', 0)}")
              lines.append(f"- Needs review: {m['summary'].get('needs_review', 0)}")
              lines.append(f"- Already in StudyTracker: {m['summary'].get('already_present', 0)}")
          transcript = Path('output/transcripts/manifest.json')
          if transcript.exists():
              counts = json.loads(transcript.read_text())['status_counts']
              lines.append(f"- Transcripts: {counts}")
          lines.append('- No live StudyTracker data changed. Approval required for imports.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          PY
      - name: Upload catalog, captions and mapping for review
        if: always() && env.RUN_PLAYLIST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ilyas-gunes-matematik-9-studytracker-bridge
          path: |
            output/playlist-catalog.json
            output/raw-playlist.json
            output/transcripts/
            output/studytracker-mapping.json
            output/studytracker-import-dry-run.json
          if-no-files-found: warn
          retention-days: 30
