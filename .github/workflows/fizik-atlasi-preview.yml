name: Fizik Atlası Lab 01 preview build
on:
  push:
    branches: [experiment/fizik-atlasi-lab-v1-20261016]
    paths:
      - 'prototypes/fizik-atlasi/lab01/**'
      - '.github/workflows/fizik-atlasi-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/fizik-atlasi/lab01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test tests/domain.test.mjs
      - name: Build cache-safe static package
        run: node package-site.mjs
      - name: Validate package manifest and cache rules
        run: node tests/site.test.mjs
      - name: Upload deploy-ready preview
        uses: actions/upload-artifact@v4
        with:
          name: fizik-atlasi-preview-${{ github.sha }}
          path: prototypes/fizik-atlasi/lab01/site/
          if-no-files-found: error
